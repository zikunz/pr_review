# gitleaks configuration.
#
# Extends the default ruleset (full coverage on application code) and allowlists
# a few files that hold fake or upstream secret-shaped strings rather than real
# credentials: the trace-redactor tests and the planted hardcoded-secret recall
# fixture (deliberate fakes the redactor tests need in cleartext), and the
# large-scale benchmark data, which is frozen diff content captured verbatim
# from public open-source pull requests. Any secret-shaped string in the latter
# comes from the upstream public diff, not from this project.
title = "PR Cascade gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Fake fixtures and frozen public-diff evaluation data"
paths = [
  '''tests/lib/trace\.test\.ts''',
  '''eval/recall-fixtures\.ts''',
  '''eval/eval-recall-results\.jsonl''',
  '''eval/largescale-prs\.json''',
  '''eval/eval-largescale\.jsonl''',
]
